# ---------- QA environment ----------
# Any key can be overridden with -Dkey=value or an environment variable (KEY_NAME).

# Application under test (React SPA) and API under test
base.url=https://www.saucedemo.com
api.base.url=https://restful-booker.herokuapp.com

# Browser: chrome | firefox | edge
browser=chrome
headless=false
# Leave empty to run locally; set to http://localhost:4444 to use Selenium Grid (see docker-compose.yml)
grid.url=

# Synchronization - explicit waits only, implicit wait is always 0
timeout.explicit=10
timeout.pageload=30

# Retries are a safety net, not a fix. 0 locally so flakiness is visible; CI sets 1 and reports retried tests.
retry.count=0

# Public demo credentials. In a real project these come from a secret manager / CI secrets.
sauce.password=secret_sauce
api.username=admin
api.password=password123
